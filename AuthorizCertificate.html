<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorization certificate</title>

    <style>
        .certificate-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: auto;
            page-break-inside: avoid;
        }

        .certificate-container img {
            width: 100%;
            height: 90%;
        }

        .name {
            position: absolute;
            top: 487px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
            text-align: center;
        }

        .center-name {
            position: absolute;
            top: 540px;
            left: 50%;
            transform: translateX(-50%);
            font-size: calc(21px - 0.2vw);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 90%;
        }

        .situated {
            position: absolute;
            top: 590px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 21px;
            text-align: center;
            max-width: 95%;
            overflow-wrap: break-word;
            word-wrap: break-word;
            hyphens: auto;
        }

        /* .situated {
            position: absolute;
            top: 590px;
            left: 50%;
            transform: translateX(-50%);
            font-size: calc(23px - 0.2vw);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 90%;
        } */

        .date {
            position: absolute;
            top: 715px;
            right: 130px;
            font-size: 17px;
        }

        @media print {

            .certificate-container {
                width: 100%;
                max-width: 800px;
                margin: auto;
                page-break-inside: avoid;
            }

            .certificate-container img {
                width: 100%;
                height: 98vh;
            }

            .name {
                position: absolute;
                top: 410px;
                left: 50%;
                transform: translateX(-50%);
                font-size: 19px;
                text-align: center;
            }

            .center-name {
                position: absolute;
                top: 455px;
                left: 50%;
                transform: translateX(-50%);
                font-size: 19px;
                text-align: center;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: 90%;
            }

            .situated {
                position: absolute;
                top: 492px;
                left: 50%;
                transform: translateX(-50%);
                font-size: 21px;
                text-align: center;
                /* white-space: nowrap; */
                /* overflow: hidden; */
                /* text-overflow: ellipsis; */
                max-width: 90%;
                overflow-wrap: break-word;
                word-wrap: break-word;
                hyphens: auto;


            }

            .date {
                position: absolute;
                top: 605px;
                right: 120px;
                font-size: 15px;
            }


        }
    </style>
</head>

<body>
    <div class="certificate-container">
        <img src="img/obce certificate (2).png" alt="Certificate Background">
        <div class="name">
            <h4>NARGIS PARVIN</h4>
        </div>
        <div class="center-name">
            <h4>Oriental Board Of Computer Education(Shason)</h4>
        </div>
        <div class="situated">
            <h4>Shason, Sardarhati, North 24 Parganas,743423
            </h4>
        </div>
        <div class="date">
            <h4>15-06-2024</h4>
        </div>
    </div>
</body>

</html>
