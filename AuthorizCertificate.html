<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorization certificate</title>

    <style>
        .certificate-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: auto;
            page-break-inside: avoid;
        }

        .certificate-container img {
            width: 100%;
            height: 90%;
        }

        .name {
            position: absolute;
            top: 487px;
            left: 325px;
            font-size: 20px;
        }

        .center-name {
            position: absolute;
            top: 540px;
            right: 192px;
            font-size: 19px;
        }

        .situated {
            position: absolute;
            top: 590px;
            right: 185px;
            font-size: 21px;
        }

        .date {
            position: absolute;
            top: 715px;
            right: 130px;
            font-size: 17px;
        }

        @media print {

            .certificate-container {
                width: 100%;
                max-width: 800px;
                margin: auto;
                page-break-inside: avoid;
            }

            .certificate-container img {
                width: 100%;
                height: 98vh;
            }

            .name {
                position: absolute;
                top: 410px;
                left: 280px;
                font-size: 19px;
            }

            .center-name {
                position: absolute;
                top: 455px;
                right: 169px;
                font-size: 19px;
            }

            .situated {
                position: absolute;
                top: 492px;
                right: 145px;
                font-size: 22px;
            }

            .date {
                position: absolute;
                top: 605px;
                right: 120px;
                font-size: 15px;
            }


        }
    </style>
</head>

<body>
    <div class="certificate-container">
        <img src="img/obce certificate (2).png" alt="Certificate Background">
        <div class="name">
            <h4>NARGIS PARVIN</h4>
        </div>
        <div class="center-name">
            <h4>Oriental Board Of Computer Education(Shason)</h4>
        </div>
        <div class="situated">
            <h4>Shason, Sardarhati, North 24 Parganas,743423</h4>
        </div>
        <div class="date">
            <h4>15-06-2024</h4>
        </div>
    </div>
</body>

</html>
